<section id="facilities-view" aria-labelledby="fc-heading" hidden>
  <header class="fc-heading"><h1 id="fc-heading">设施</h1><span id="fc-count" aria-live="polite"></span></header>
  <div class="fc-filters">
    <label>查找设施<input id="fc-query" type="search" placeholder="名称、生产用途或工作类型" spellcheck="false"></label>
    <label>设施类别<select id="fc-category"><option value="">全部类别</option></select></label>
    <label>工作类型<select id="fc-job"><option value="">全部工作</option></select></label>
  </div>
  <div class="fc-layout">
    <div class="fc-list" id="fc-list" aria-label="设施列表"></div>
    <article class="fc-detail" id="fc-detail" aria-label="设施详情"></article>
  </div>
</section>
