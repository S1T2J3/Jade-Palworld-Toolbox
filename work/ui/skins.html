<section id="settings-view" aria-labelledby="sk-title" hidden>
  <h1 id="sk-title">设置</h1>
  <fieldset class="sk-settings">
    <legend>界面皮肤</legend>
    <div class="sk-layout">
      <label class="sk-card sk-feature">
        <span class="sk-feature-art">
          <img id="sk-art" width="300" height="300" data-src="__JADE_SKIN_ART__" alt="" decoding="async">
        </span>
        <span class="sk-caption">
          <span><strong>辉月伊</strong><small>默认皮肤</small></span>
          <input type="radio" name="atlas-theme" value="moon">
        </span>
      </label>
      <div class="sk-basics" role="group" aria-labelledby="sk-basic-title">
        <h2 id="sk-basic-title">纯色皮肤</h2>
        <div class="sk-options" id="sk-options"></div>
      </div>
    </div>
    <p id="sk-storage-note" class="sk-storage-note" role="status" hidden>当前窗口已应用此配色，关闭后需要重新选择。</p>
  </fieldset>
</section>
