<footer class="external-directory">
  <details id="external-directory">
    <summary>需要联网的条目</summary>
    <div class="external-panel">
      <p data-external-status role="status" hidden></p>
      <button data-external-retry type="button" hidden>重新读取</button>
      <div data-external-tools hidden>
        <label>查找外部条目<input type="search" autocomplete="off" placeholder="名称、物品 ID 或网站" data-external-query></label>
        <p aria-live="polite" data-external-count></p>
        <div data-external-results></div>
      </div>
    </div>
  </details>
</footer>
