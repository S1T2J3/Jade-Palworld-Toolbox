[package]
name = "jade-saves"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
regex = "1"
flate2 = "1"
oozextract = "0.5"
uesave = { path = "vendor/uesave", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
