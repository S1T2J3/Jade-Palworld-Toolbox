// Pal Atlas local application chrome registration.
(() => {
  Services.io.manageOfflineStatus=false;
  Services.io.offline=true;
  const env=Cc["@mozilla.org/process/environment;1"].getService(Ci.nsIEnvironment);
  const shell=Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
  shell.initWithPath(env.get("PAL_ATLAS_SHELL"));
  const manifest=shell.clone();manifest.append("chrome.manifest");
  Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);
  ChromeUtils.registerWindowActor("PalAtlasHost",{
    matches:["file:///*"],messageManagerGroups:["palatlas"],allFrames:false,
    parent:{esModuleURI:"chrome://palatlas/content/PalAtlasHostParent.sys.mjs"},
    child:{esModuleURI:"chrome://palatlas/content/PalAtlasHostChild.sys.mjs",events:{
      click:{capture:true},keydown:{capture:true},
      DOMContentLoaded:{capture:true},
      "pal-theme-changed":{capture:true,wantUntrusted:true},
      "pal-release-request":{capture:true,wantUntrusted:true},
      "pal-save-backup":{capture:true,wantUntrusted:true},
      "pal-read-game-saves":{capture:true,wantUntrusted:true},
      "pal-read-terminal":{capture:true,wantUntrusted:true},
      "pal-new-window":{capture:true,wantUntrusted:true},
      "pal-open-legacy":{capture:true,wantUntrusted:true}
    }}
  });
  if(env.get("PAL_ATLAS_EARLY_WINDOW")==="1" &&
     Services.appinfo.processType===Ci.nsIXULRuntime.PROCESS_TYPE_DEFAULT) {
    const appWindow="chrome://palatlas/content/main.xhtml";
    let startupCommand=null;
    Services.obs.addObserver(function captureCommand(subject) {
      Services.obs.removeObserver(captureCommand,"command-line-startup");
      const cmd=subject.QueryInterface(Ci.nsICommandLine);
      if(cmd.state===Ci.nsICommandLine.STATE_INITIAL_LAUNCH) startupCommand=cmd;
    },"command-line-startup");
    Services.obs.addObserver(function openFirstWindow() {
      Services.obs.removeObserver(openFirstWindow,"final-ui-startup");
      const cmd=startupCommand;
      startupCommand=null;
      if(!cmd || cmd.preventDefault) return;
      function requestedIndex() {
        const i=cmd.findFlag("chrome",false);
        return i>=0 && i+1<cmd.length && cmd.getArgument(i+1)===appWindow ? i : -1;
      }
      if(requestedIndex()<0) return;
      // Keep Firefox's standard -chrome path for a failed or skipped early open.
      // Use a regular application window, outside Firefox's silent-start mode.
      let opened;
      try {
        opened=Services.ww.openWindow(null,appWindow,"_blank","chrome,dialog=no,all,resizable",null);
        if(!opened) return;
        const i=requestedIndex();
        if(i<0) {opened.close();return;}
        cmd.removeArguments(i,i+1);
        cmd.preventDefault=true;
      } catch {
        if(opened) opened.close();
      }
    },"final-ui-startup");
  }
})();
